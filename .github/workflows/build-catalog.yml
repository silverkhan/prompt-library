name: Build Prompt Catalog

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/build_catalog.py"
      - ".github/workflows/build-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt-catalog-main
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Build and validate catalog
        run: python scripts/build_catalog.py

      - name: Commit catalog when changed
        shell: bash
        run: |
          if git diff --quiet -- CATALOG.md; then
            echo "CATALOG.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CATALOG.md
          git commit -m "chore: update prompt catalog"
          git push origin main
